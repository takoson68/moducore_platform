name: Deploy staging

on:
  push:
    tags:
      - 'dep_*_v*'
  workflow_dispatch:
    inputs:
      target:
        description: '救援部署目標（一次只允許一個專案）'
        type: choice
        required: true
        default: game-demo
        options:
          - game-demo
          - dinecore
          - project-b
      ref:
        description: '要部署的 Branch、Tag 或 Commit SHA；留空使用目前選定分支'
        type: string
        required: false
      simulate_failure:
        description: 'M1 安全失敗演練：在遠端 migration 與部署前停止'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
      checkout-ref: ${{ steps.targets.outputs.checkout-ref }}
      is-tag-release: ${{ steps.targets.outputs.is-tag-release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: targets
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_TAG: ${{ github.ref_name }}
          DEPLOY_PROJECT: ${{ inputs.target }}
          DEPLOY_REF: ${{ inputs.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node platform/worker/scripts/release-plan.mjs

  deploy:
    needs: plan
    if: needs.plan.outputs.has-targets == 'true'
    name: Deploy ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.checkout-ref || github.sha }}

      - name: Resolve immutable source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/frontend/package-lock.json
            platform/worker/package-lock.json

      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci

      - name: Build isolated project assets
        working-directory: platform/frontend
        env:
          VITE_PROJECT: ${{ matrix.project }}
          VITE_API_MODE: real
        run: npm run build:cloudflare -- --outDir ../worker/.assets/${{ matrix.target }}

      - name: Package immutable release ZIP
        id: package
        working-directory: platform/frontend
        run: |
          node scripts/create-release-package.mjs \
            --project '${{ matrix.project }}' \
            --target '${{ matrix.target }}' \
            --version '${{ matrix.version }}' \
            --tag '${{ matrix.tag }}' \
            --commit '${{ steps.source.outputs.commit }}' \
            --assets '../worker/.assets/${{ matrix.target }}' \
            --output '../../release-output'

      - name: Preserve release package for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.manifest }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 7

      - name: Test frontend API token transport
        working-directory: platform/frontend
        run: npm run test:api

      - name: Test project-b login panel
        if: matrix.project == 'project-b'
        working-directory: platform/frontend
        run: |
          npm run test:project-b-auth
          npm run test:employee

      - name: Install Worker dependencies
        working-directory: platform/worker
        run: npm ci

      - name: Test Worker
        working-directory: platform/worker
        run: npm test

      - name: Verify Worker bundle
        working-directory: platform/worker
        run: npm run check -- --config wrangler.${{ matrix.target }}.json

      - name: Simulate safe staging failure
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo 'M1 failure drill: stop before remote migrations and deployment.'
          exit 1

      - name: Apply D1 migrations
        if: matrix.database == true
        working-directory: platform/worker
        run: npm run db:migrate:remote -- --config wrangler.${{ matrix.target }}.json

      - name: Deploy Worker and Static Assets
        id: deploy-worker
        working-directory: platform/worker
        run: |
          set -o pipefail
          npm run deploy -- --config wrangler.${{ matrix.target }}.json | tee deploy-output.txt
          version_id=$(sed -n 's/^Current Version ID: //p' deploy-output.txt | tail -n 1)
          test -n "$version_id"
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify public staging endpoints
        if: matrix.database == true
        working-directory: platform/worker
        run: node scripts/smoke.mjs https://${{ matrix.target }}.takoson68.workers.dev ${{ matrix.target }}

      - name: Verify game static site and SPA fallback
        if: matrix.project == 'game-demo'
        run: |
          base='https://${{ matrix.target }}.takoson68.workers.dev'
          curl --fail --silent --show-error "$base/" | grep 'id="app"'
          curl --fail --silent --show-error "$base/version-check" | grep 'id="app"'

      - name: Verify remote authentication and D1 session lifecycle
        if: matrix.database == true
        working-directory: platform/worker
        env:
          VERIFY_PEER_ISOLATION: '1'
        run: node scripts/smoke-auth-remote.mjs ${{ matrix.target }}

      - name: Verify project-b Employee API
        if: matrix.project == 'project-b'
        working-directory: platform/worker
        run: node scripts/smoke-employees-remote.mjs --execute-staging

      - name: Publish immutable GitHub Release
        if: needs.plan.outputs.is-tag-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ matrix.tag }}'
          notes="Project: ${{ matrix.project }}
          Target: ${{ matrix.target }}
          Commit: ${{ steps.source.outputs.commit }}
          Cloudflare Version: ${{ steps.deploy-worker.outputs.version-id }}"
          if gh release view "$tag" --json assets >/dev/null 2>&1; then
            asset_count=$(gh release view "$tag" --json assets --jq '.assets | length')
            test "$asset_count" = '0' || { echo 'Release 已有資產，拒絕覆寫不可變版本'; exit 1; }
            gh release upload "$tag" \
              '${{ steps.package.outputs.zip }}' \
              '${{ steps.package.outputs.manifest }}' \
              '${{ steps.package.outputs.checksum }}'
            gh release edit "$tag" --title '${{ matrix.project }} v${{ matrix.version }}' --notes "$notes"
          else
            gh release create "$tag" \
              '${{ steps.package.outputs.zip }}' \
              '${{ steps.package.outputs.manifest }}' \
              '${{ steps.package.outputs.checksum }}' \
              --verify-tag \
              --title '${{ matrix.project }} v${{ matrix.version }}' \
              --notes "$notes"
          fi
